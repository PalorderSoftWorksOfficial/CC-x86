name: Lua checks

on:
  push:
  pull_request:

jobs:
  syntax-and-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua 5.2
        run: sudo apt-get update && sudo apt-get install -y lua5.2
      - name: Compile-check Lua sources
        run: |
          find . -name '*.lua' -not -path './.git/*' -print0 | xargs -0 -n1 luac5.2 -p
      - name: Run emulator tests
        run: lua5.2 tests/run.lua
